{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Book a Table - Little Lemon</title>
    <meta name="description" content="Reserve a table at Little Lemon Restaurant" />

    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="{% static 'img/favicon.ico' %}"
    />

    <link
      rel="stylesheet"
      href="{% static 'css/style.css' %}"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla&family=Markazi+Text:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      .booking-form {
        max-width: 600px;
        margin: 2rem auto;
        padding: 2rem;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }
      .form-group {
        margin-bottom: 1.5rem;
      }
      .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        color: #495e57;
        font-weight: bold;
      }
      .form-group input,
      .form-group select {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 1rem;
        font-family: 'Karla', sans-serif;
      }
      .form-group input:focus,
      .form-group select:focus {
        outline: none;
        border-color: #f4ce14;
      }
      .submit-btn {
        background-color: #f4ce14;
        color: #333;
        padding: 1rem 2rem;
        border: none;
        border-radius: 4px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
        transition: background-color 0.3s;
      }
      .submit-btn:hover {
        background-color: #d4ae00;
      }
      .message {
        padding: 1rem;
        margin-bottom: 1rem;
        border-radius: 4px;
        text-align: center;
      }
      .message.success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .message.error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="{% static 'img/logo.png' %}" alt="Little Lemon Restaurant Logo" />
    </header>
    <nav>
      <ul>
        <li><a href="{% url 'index' %}">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="{% url 'menu' %}">Menu</a></li>
        <li><a href="{% url 'book' %}">Book</a></li>
      </ul>
    </nav>
    <main style="padding: 2rem;">
      <section>
        <h1 style="font-size: 3rem; margin-bottom: 2rem; text-align: center;">Book a Table</h1>
        <div class="booking-form">
          {% if message %}
            <div class="message {{ message_type }}">
              {{ message }}
            </div>
          {% endif %}
          <form method="POST" action="{% url 'book' %}">
            {% csrf_token %}
            <div class="form-group">
              <label for="name">Name *</label>
              <input type="text" id="name" name="name" required placeholder="Your full name" value="{{ request.POST.name|default:'' }}">
            </div>
            <div class="form-group">
              <label for="no_of_guests">Number of Guests *</label>
              <select id="no_of_guests" name="no_of_guests" required>
                <option value="">Select number of guests</option>
                {% for i in "12345678901234567890"|make_list %}
                  <option value="{{ forloop.counter }}" {% if request.POST.no_of_guests == forloop.counter|stringformat:"s" %}selected{% endif %}>{{ forloop.counter }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="form-group">
              <label for="BookingDate">Date & Time *</label>
              <input type="datetime-local" id="BookingDate" name="BookingDate" required value="{{ request.POST.BookingDate|default:'' }}">
            </div>
            <button type="submit" class="submit-btn">Reserve Table</button>
          </form>
        </div>
      </section>
    </main>
    <footer>
      <article>
        <img src="{% static 'img/logo_footer.png' %}" alt="Little Lemon Restaurant Logo" />
      </article>
      <article>
        <p>Copyright {% now "Y" %} Little Lemon</p>
      </article>
    </footer>
    <script>
      // Set minimum date to today
      const dateInput = document.getElementById('BookingDate');
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      dateInput.min = now.toISOString().slice(0, 16);
      
      // If form was submitted successfully, scroll to top to show message
      {% if message and message_type == 'success' %}
        window.scrollTo({ top: 0, behavior: 'smooth' });
        // Reset form after successful submission
        setTimeout(function() {
          document.querySelector('form').reset();
        }, 2000);
      {% endif %}
    </script>
  </body>
</html>
